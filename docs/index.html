"Load illustrative example", "zh-CN": "载入示例情景"}, "scenarioNote": {"pt-BR": "Campos vazios aguardam suas premissas. O exemplo é fictício e não representa preço de mercado. Valores monetários de entrada em BRL.", "en-US": "Empty fields await your assumptions. The example is fictional and does not represent market pricing. Monetary inputs are in BRL.", "zh-CN": "请填写假设。示例为虚构情景，不代表市场价格。金额输入单位为巴西雷亚尔（BRL）。"}, "fixed": {"pt-BR": "Custos fixos alocados / mês (BRL)", "en-US": "Allocated fixed cost / month (BRL)", "zh-CN": "分摊固定成本 / 月（BRL）"}, "variable": {"pt-BR": "Custo variável / dia faturado (BRL)", "en-US": "Variable cost / billable day (BRL)", "zh-CN": "可变成本 / 计费日（BRL）"}, "logistics": {"pt-BR": "Orçamento logístico / mês (BRL)", "en-US": "Logistics budget / month (BRL)", "zh-CN": "物流预算 / 月（BRL）"}, "available": {"pt-BR": "Dias disponíveis no mês", "en-US": "Available days in month", "zh-CN": "当月可用天数"}, "billable": {"pt-BR": "Dias faturados no mês", "en-US": "Billable days in month", "zh-CN": "当月计费天数"}, "margin": {"pt-BR": "Margem operacional desejada (%)", "en-US": "Target operating margin (%)", "zh-CN": "目标经营利润率（%）"}, "quote": {"pt-BR": "Diária da proposta (BRL, opcional)", "en-US": "Quoted day rate (BRL, optional)", "zh-CN": "报价日租金（BRL，可选）"}, "floor": {"pt-BR": "Diária para margem-alvo", "en-US": "Day rate for target margin", "zh-CN": "达到目标利润率所需日租金"}, "utilisation": {"pt-BR": "Utilização planejada", "en-US": "Planned utilisation", "zh-CN": "计划利用率"}, "actualMargin": {"pt-BR": "Margem na diária informada", "en-US": "Margin at quoted day rate", "zh-CN": "报价下的利润率"}, "breakeven": {"pt-BR": "Dias para equilíbrio", "en-US": "Days to break even", "zh-CN": "盈亏平衡计费天数"}, "priceAria": {"pt-BR": "Diária mínima por quantidade de dias faturados", "en-US": "Required day rate by billable days", "zh-CN": "不同计费天数下的所需日租金"}, "priceFormula": {"pt-BR": "Ver cálculo e premissas", "en-US": "View calculation and assumptions", "zh-CN": "查看公式与假设"}, "priceMethod": {"pt-BR": "Diária = (fixos + logística + custo variável × dias faturados) ÷ [dias faturados × (1 − margem)]. A margem é sobre receita, não markup sobre custo. Equilíbrio = teto[(fixos + logística) ÷ (diária informada − variável)]. Inclua depreciação, capital, manutenção e tributos nos custos conforme sua operação. Não é uma avaliação financeira completa.", "en-US": "Day rate = (fixed + logistics + variable cost × billable days) ÷ [billable days × (1 − margin)]. Margin is on revenue, not a markup on cost. Break-even = ceiling[(fixed + logistics) ÷ (quoted rate − variable cost)]. Include depreciation, capital, maintenance and taxes in costs as appropriate. This is not a complete financial valuation.", "zh-CN": "日租金 =（固定成本 + 物流 + 可变成本 × 计费天数）÷ [计费天数 ×（1 − 利润率）]。利润率以收入为基数，并非成本加成率。盈亏平衡天数 = 向上取整[（固定成本 + 物流）÷（报价日租金 − 日可变成本）]。请按实际业务计入折旧、资金、维护和税费；此处不是完整财务估值。"}, "chapterOperations": {"pt-BR": "03 / CENÁRIO DA FAZENDA", "en-US": "03 / FARM SCENARIO", "zh-CN": "03 / 农场情景"}, "operationsTitle": {"pt-BR": "Uma janela curta muda a conta da frota.", "en-US": "A shorter window changes the fleet equation.", "zh-CN": "更短的作业窗口，改变机队配置。"}, "operationsDesc": {"pt-BR": "Dimensione uma operação, uma classe de máquina e uma capacidade efetiva. Veja quantas máquinas adicionais seriam necessárias.", "en-US": "Size one operation, one machine class and one effective capacity. See how many additional machines would be needed.", "zh-CN": "针对单项作业、同类设备及其有效作业能力，测算需要增租多少台设备。"}, "farmNote": {"pt-BR": "Sem previsão meteorológica: a janela é uma premissa sua. Máquinas consideradas equivalentes e disponíveis durante toda a janela. Dias cobrados podem superar os dias úteis de trabalho.", "en-US": "No weather forecast: the window is your assumption. Machines are equivalent and available throughout the window. Charged days may exceed usable work days.", "zh-CN": "不含天气预测：作业窗口由您设定。假定设备同类且整个窗口期均可使用。计费天数可能超过可作业天数。"}, "farmArea": {"pt-BR": "Área da operação (ha)", "en-US": "Operation area (ha)", "zh-CN": "作业面积（公顷）"}, "capacity": {"pt-BR": "Capacidade efetiva (ha/h por máquina)", "en-US": "Effective capacity (ha/h per machine)", "zh-CN": "单台有效作业能力（公顷/小时）"}, "hours": {"pt-BR": "Horas de trabalho / dia", "en-US": "Working hours / day", "zh-CN": "每日作业小时数"}, "window": {"pt-BR": "Dias úteis na janela", "en-US": "Usable work days in window", "zh-CN": "窗口内可作业天数"}, "owned": {"pt-BR": "Máquinas próprias disponíveis", "en-US": "Own machines available", "zh-CN": "可用自有设备台数"}, "charged": {"pt-BR": "Dias cobrados da locação", "en-US": "Charged rental days", "zh-CN": "租赁计费天数"}, "farmRate": {"pt-BR": "Diária cotada / máquina (BRL)", "en-US": "Quoted rate / machine-day (BRL)", "zh-CN": "单台设备日租金（BRL）"}, "freight": {"pt-BR": "Frete por máquina alugada (BRL)", "en-US": "Freight per rented machine (BRL)", "zh-CN": "每台租赁设备运费（BRL）"}, "required": {"pt-BR": "Máquinas necessárias", "en-US": "Machines required", "zh-CN": "所需设备台数"}, "additional": {"pt-BR": "Máquinas para alugar", "en-US": "Machines to rent", "zh-CN": "需租赁设备台数"}, "ownedCoverage": {"pt-BR": "Cobertura da frota própria", "en-US": "Own fleet area coverage", "zh-CN": "自有机队面积覆盖率"}, "rentalCost": {"pt-BR": "Custo estimado da locação", "en-US": "Estimated rental cost", "zh-CN": "预计租赁成本"}, "farmAria": {"pt-BR": "Máquinas para alugar por duração da janela de trabalho", "en-US": "Machines to rent by work-window duration", "zh-CN": "不同作业窗口下需租赁的设备台数"}, "farmFormula": {"pt-BR": "Ver dimensionamento e limites", "en-US": "View sizing and limits", "zh-CN": "查看配置公式与限制"}, "farmMethod": {"pt-BR": "Máquinas necessárias = teto[área ÷ (capacidade efetiva × horas/dia × dias úteis)]. Adicionais = máximo(0, necessárias − próprias). Custo = adicionais × (diária × dias cobrados + frete). A capacidade efetiva já deve refletir manobras e perdas de campo. O custo não inclui combustível, operador ou outros itens que não estejam na sua proposta. Para comparar janelas no gráfico, pressupõe-se disponibilidade contratual suficiente.", "en-US": "Required machines = ceiling[area ÷ (effective capacity × hours/day × usable days)]. Additional = max(0, required − owned). Cost = additional × (rate × charged days + freight). Effective capacity should already reflect turns and field losses. Cost excludes fuel, operators and other items outside your quote. The chart assumes sufficient contractual availability for alternative windows.", "zh-CN": "所需台数 = 向上取整[面积 ÷（有效能力 × 每日小时数 × 可作业天数）]。增租台数 = max（0，所需 − 自有）。成本 = 增租台数 ×（日租金 × 计费天数 + 运费）。有效能力应已计入转弯和田间损失。成本不包含报价外的燃油、操作员等项目。图中不同窗口假定合同可用期足够。"}, "baseChapter": {"pt-BR": "04 / BASE AUDITÁVEL", "en-US": "04 / AUDITABLE BASE", "zh-CN": "04 / 可审计数据"}, "baseTitle": {"pt-BR": "Todos os 27 estados. Sem pontuação oculta.", "en-US": "All 27 states. No hidden score.", "zh-CN": "全部 27 个州级单位，无隐藏评分。"}, "sort": {"pt-BR": "Ordenar comparação dos estados", "en-US": "Sort state comparison", "zh-CN": "排序州级比较"}, "sortGap": {"pt-BR": "Área menos locação (pp)", "en-US": "Crop share minus rental share (pp)", "zh-CN": "面积份额减租赁份额（百分点）"}, "sortArea": {"pt-BR": "Área das culturas selecionadas", "en-US": "Selected crop area", "zh-CN": "所选作物面积"}, "state": {"pt-BR": "Estado", "en-US": "State", "zh-CN": "州"}, "areaM": {"pt-BR": "Área, milhões ha", "en-US": "Area, million ha", "zh-CN": "面积，百万公顷"}, "difference": {"pt-BR": "Diferença, pp", "en-US": "Difference, pp", "zh-CN": "差值，百分点"}, "methodChapter": {"pt-BR": "05 / DA ANÁLISE À VALIDAÇÃO", "en-US": "05 / FROM ANALYSIS TO VALIDATION", "zh-CN": "05 / 从分析到验证"}, "methodTitle": {"pt-BR": "Uma hipótese comercial precisa sobreviver ao campo.", "en-US": "A commercial hypothesis needs to survive field validation.", "zh-CN": "商业假设需要经得起实地验证。"}, "method1": {"pt-BR": "1. Defina o cliente e a máquina", "en-US": "1. Scope the customer and machine", "zh-CN": "1. 明确客户与设备"}, "method1desc": {"pt-BR": "Trator, plantadeira e colheitadeira são perguntas diferentes. O cadastro não identifica tipos nem capacidade da frota. A área é um contexto produtivo, não uma carteira de contratos.", "en-US": "Tractors, planters and harvesters are different questions. The register does not identify fleet types or capacity. Crop area is production context, not a contract pipeline.", "zh-CN": "拖拉机、播种机和收割机对应不同需求。登记数据不提供机型或机队能力。种植面积是生产背景，并非订单储备。"}, "method2": {"pt-BR": "2. Valide a operação local", "en-US": "2. Validate the local operation", "zh-CN": "2. 验证当地经营模式"}, "method2desc": {"pt-BR": "Investigue frota própria, serviços com operador, deslocamento entre estados, oficinas e propostas reais. Um estabelecimento pode atender clientes fora do estado onde está registrado.", "en-US": "Investigate own fleets, services with operator, cross-state travel, workshops and real quotes. One establishment can serve customers outside its registered state.", "zh-CN": "调研自有机队、含操作员服务、跨州调运、维修网点与真实报价。一个经营场所可能服务登记州以外的客户。"}, "method3": {"pt-BR": "3. Substitua hipótese por evidência", "en-US": "3. Replace assumptions with evidence", "zh-CN": "3. 用证据替代假设"}, "method3desc": {"pt-BR": "Preços, disponibilidade, utilização e logística não estão nesta base pública. Os simuladores usam suas premissas; valide-as antes de recomendar filial, transferência ou investimento.", "en-US": "Prices, availability, utilisation and logistics are absent from this public base. Simulators use your assumptions; validate them before recommending a branch, transfer or investment.", "zh-CN": "该公共数据不包含价格、可用设备、利用率与物流。模拟器使用您的假设；建议设点、调拨或投资前须先验证。"}, "definitions": {"pt-BR": "Definições das fontes e limites analíticos", "en-US": "Source definitions and analytical limits", "zh-CN": "来源定义与分析限制"}, "definition1": {"pt-BR": "CEMPRE 9528: unidades locais e pessoal ocupado na CNAE 77.31-4, locação agrícola sem operador. CEMPRE 9418: empresas no Brasil. PAM 1612: área plantada de soja, milho em grão, cana-de-açúcar e algodão herbáceo. A soma das quatro culturas não representa todo o mercado agrícola nem terras físicas únicas; a mesma terra pode ter mais de um plantio. A locação também atende culturas e usos não incluídos.", "en-US": "CEMPRE 9528: local units and employment in CNAE 77.31-4, agricultural rental without operator. CEMPRE 9418: enterprises in Brazil. PAM 1612: planted area of soybeans, grain corn, sugar cane and herbaceous cotton. The four-crop sum is neither the whole agricultural market nor unique physical land; the same land may have multiple crops. Rental also serves omitted crops and uses.", "zh-CN": "CEMPRE 9528：CNAE 77.31-4 不含操作员的农业租赁经营场所与就业人数。CEMPRE 9418：巴西企业数量。PAM 1612：大豆、籽粒玉米、甘蔗与草棉种植面积。四种作物之和既非全部农业市场，也非不重复的土地面积；同一土地可能多次种植。租赁还服务于未列入的作物及用途。"}, "definition2": {"pt-BR": "Referências anuais alinhadas de 2022 a 2024. Não são anúncios ativos de hoje. A série CEMPRE usa a metodologia iniciada em 2022, sem comparação anterior. Dados suprimidos ou ausentes permanecem indisponíveis; o traço que denota zero absoluto é tratado como zero. Limites estaduais simplificados do IBGE, para orientação visual.", "en-US": "Aligned annual reference years, 2022–2024. These are not today’s active listings. CEMPRE uses the methodology introduced in 2022, with no earlier comparison. Suppressed or missing values remain unavailable; a dash denoting absolute zero is treated as zero. Simplified official IBGE state boundaries provide visual orientation.", "zh-CN": "年度口径对齐为 2022–2024 年，并非当前有效的租赁挂牌。CEMPRE 使用 2022 年起的新方法，不与更早年份比较。隐匿或缺失值保持不可用；表示绝对零值的横线按零处理。简化后的 IBGE 官方州界仅供视觉定位。"}, "definition3": {"pt-BR": "Diferença = 100 × (área estadual ÷ área Brasil − unidades locais estaduais ÷ unidades locais Brasil). O denominador permanece nacional. Densidade é descritiva, não necessidade de frota ou adoção da locação. Não se infere faturamento, transações, previsão ou tamanho financeiro do mercado.", "en-US": "Difference = 100 × (state area ÷ Brazil area − state local units ÷ Brazil local units). Denominators remain national. Density is descriptive, not fleet requirements or rental adoption. No revenue, transactions, forecast or financial market-size estimate is inferred.", "zh-CN": "差值 = 100 ×（州面积 ÷ 巴西面积 − 州经营场所数 ÷ 巴西经营场所数）。分母始终为全国总量。密度为描述性指标，不代表所需机队或租赁渗透率。不据此推 function renderPrice(){const p=priceInput(),result=hasMissing(priceFields.filter(id=>id!=='quote'))?null:RentalModels.price(p);priceChart?.destroy();priceChart=null;['price-floor','utilisation','actual-margin','breakeven'].forEach(id=>$(id).textContent='—');$('price-status').textContent=t(hasMissing(priceFields.filter(id=>id!=='quote'))?'fillFields':!result?'invalidPrice':priceDemo?'demoStatus':'calculated');if(!result)return;
 $('price-floor').textContent=money(result.floor);$('utilisation').textContent=pct(result.utilisation);$('actual-margin').textContent=result.margin===null?'—':pct(result.margin);$('breakeven').textContent=p.quote===null?'—':result.breakeven===null?t('noBreakeven'):result.breakeven>p.available?t('beyondWindow',{value:fmt(result.breakeven)}):fmt(result.breakeven)+' '+t('days');const days=Array.from({length:p.available},(_,i)=>i+1),code=$('currency').value,divisor=code!=='BRL'&&RentalModels.usableFx(fx)?fx.brl_per_unit[code]:1;
 priceChart=new Chart($('price-chart'),{type:'line',data:{labels:days,datasets:[{label:t('floor'),data:days.map(d=>RentalModels.price({...p,billable:d}).floor/divisor),borderColor:'#007E84',backgroundColor:'#007E8415',fill:true,tension:.25,pointRadius:days.map(d=>d===p.billable?6:0),pointBackgroundColor:'#C26642'}]},options:options({scales:{x:{title:{display:true,text:t('billableAxis')},grid:{display:false}},y:{beginAtZero:true,ticks:{callback:v=>fmt(v)},title:{display:true,text:divisor===1?'BRL':code}}}})});
}
function renderFarm(){const p=farmInput(),missing=hasMissing(farmFields),result=missing?null:RentalModels.farm(p);farmChart?.destroy();farmChart=null;['required','additional','coverage','rental-cost'].forEach(id=>$(id).textContent='—');$('farm-status').textContent=t(missing?'fillFields':!result?'invalidFarm':farmDemo?'demoStatus':'calculated');if(!result)return;
 $('required').textContent=fmt(result.required);$('additional').textContent=fmt(result.additional);$('coverage').textContent=pct(result.coverage);$('rental-cost').textContent=money(result.cost);const low=Math.max(1,p.window-6),days=Array.from({length:13},(_,i)=>low+i);
 farmChart=new Chart($('farm-chart'),{type:'line',data:{labels:days,datasets:[{label:t('machinesAxis'),data:days.map(d=>RentalModels.farm({...p,window:d,charged:Math.max(p.charged,d)}).additional),borderColor:'#C26642',backgroundColor:'#C2664215',fill:true,stepped:true,pointRadius:days.map(d=>d===p.window?6:2)}]},options:options({scales:{x:{title:{display:true,text:t('windowAxis')},grid:{display:false}},y:{beginAtZero:true,ticks:{precision:0},title:{display:true,text:t('machinesAxis')}}}})});
}
function renderFx(){const valid=RentalModels.usableFx(fx);$('fx-usd').textContent=fx?fmt(fx.brl_per_unit.USD,4):'—';$('fx-cny').textContent=fx?fmt(fx.brl_per_unit.CNY,4):'—';$('fx-status').textContent=t(fxMode==='loading'?'fxLoading':!fx?'fxFailed':!valid?'fxStale':fxMode==='cached'?'fxCached':'fxFresh');$('fx-date').textContent=fx?t('fxDate',{date:new Intl.DateTimeFormat(locale,{timeZone:'UTC'}).format(new Date(fx.reference_date+'T00:00:00Z')),checked:new Intl.DateTimeFormat(locale,{dateStyle:'short',timeStyle:'short',timeZone:'America/Sao_Paulo'}).format(new Date(fx.checked_at))+' (UTC−03)'}):'';const amount=read('fx-amount');$('fx-converted').textContent=valid&&amount!==null&&Number.isFinite(amount)&&amount>=0?['USD','CNY'].map(code=>new Intl.NumberFormat(locale,{style:'currency',currency:code,currencyDisplay:'code'}).format(amount/fx.brl_per_unit[code])).join(' · '):'—';$('currency').querySelectorAll('option').forEach(o=>o.disabled=o.value!=='BRL'&&!valid);if(!valid)$('currency').value='BRL'}
const FX_URL='https://data-api.ecb.europa.eu/service/data/EXR/D.USD+BRL+CNY.EUR.SP00.A?lastNObservations=1&format=csvdata';
let fxPending=false;
async function refreshFx(){if(fxPending)return;fxPending=true;fxMode='loading';$('fx-refresh').disabled=true;renderFx();const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),18000);try{const response=await fetch(FX_URL,{signal:controller.signal,cache:'no-store',headers:{Accept:'text/csv'}});if(!response.ok)throw Error('HTTP '+response.status);fx=RentalModels.fxFromCsv(await response.text());fx.url=FX_URL;fxMode='fresh';try{localStorage.setItem('agri-atlas-fx',JSON.stringify(fx))}catch{}}catch{fxMode=fx?'cached':'failed'}finally{clearTimeout(timeout);fxPending=false;$('fx-refresh').disabled=false;renderFx();renderPrice();renderFarm()}}
function translate(){document.documentElement.lang=locale;$('language').value=locale;document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));document.querySelectorAll('[data-aria]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.aria)));document.querySelector('meta[name="description"]').content=t('lede');renderMarket();renderFx();renderPrice();renderFarm()}
$('language').addEventListener('change',()=>{locale=$('language').value;try{localStorage.setItem('agri-atlas-language',locale)}catch{}translate()});for(const id of ['year','crop','focus','sort'])$(id).addEventListener('change',renderMarket);
for(const id of priceFields)$(id).addEventListener('input',()=>{priceDemo=false;renderPrice()});for(const id of farmFields)$(id).addEventListener('input',()=>{farmDemo=false;renderFarm()});for(const id of ['price-form','farm-form'])$(id).addEventListener('submit',e=>e.preventDefault());
$('demo-price').addEventListener('click',()=>{Object.entries({fixed:15000,variable:450,logistics:3000,available:26,billable:18,margin:20,quote:2000}).forEach(([k,v])=>$(k).value=v);priceDemo=true;renderPrice()});$('demo-farm').addEventListener('click',()=>{Object.entries({'farm-area':3000,capacity:8,hours:10,window:10,owned:2,charged:12,'farm-rate':2000,freight:3000}).forEach(([k,v])=>$(k).value=v);farmDemo=true;renderFarm()});$('fx-refresh').addEventListener('click',refreshFx);$('fx-amount').addEventListener('input',renderFx);$('currency').addEventListener('change',()=>{renderPrice();renderFarm()});
$('export').addEventListener('click',()=>{const c=current(),result={source:'IBGE CEMPRE 9528/9418 and PAM 1612',scope:DATA.scope,year:c.year,crop:c.crop,focus_state:$('focus').value,comparison_scope:'All 27 states; national denominators',locale,national:c.national,states:c.rows,scenarios:{input_currency:'BRL',price:priceInput(),farm:farmInput(),illustrative:{price:priceDemo,farm:farmDemo}},exchange_reference:fx,exchange_valid_at_export:RentalModels.usableFx(fx),exported_at:new Date().toISOString()};const url=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='agri-rental-'+c.year+'-'+c.crop+'.json';a.click();URL.revokeObjectURL(url)});
translate();refreshFx();setInterval(()=>{if(!document.hidden)refreshFx()},15*60*1000);
</script></body></html>
